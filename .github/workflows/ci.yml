name: CI

on:
  push:
    branches: ["main", "milestone-1-foundation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./build/ci.db

    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: complete-bot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Format source
        run: ruff format .

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations src tests
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:complete-bot

      - name: Type check
        run: mypy src tests

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Verify clean migration
        run: alembic upgrade head
