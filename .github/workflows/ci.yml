name: CI

on:
  push:
    branches: ["main", "milestone-1-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./build/ci.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Format working tree
        run: ruff format .

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-source
          path: |
            migrations
            src
            tests
          retention-days: 1

      - name: Require committed formatting
        run: git diff --exit-code

      - name: Type check
        run: mypy src tests

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Verify clean migration
        run: alembic upgrade head
