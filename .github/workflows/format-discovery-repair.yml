name: Format discovery repair

on:
  push:
    branches:
      - web/setup-auto-discovery-ci-fix
    paths:
      - .github/workflows/format-discovery-repair.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: web/setup-auto-discovery-ci-fix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff==0.16.4"

      - name: Format discovery files
        run: |
          ruff format \
            src/marwie_bot/features/configuration/cog.py \
            src/marwie_bot/features/configuration/provisioning.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "Aerol"
          git config user.email "52475561+Aedwon@users.noreply.github.com"
          git add \
            src/marwie_bot/features/configuration/cog.py \
            src/marwie_bot/features/configuration/provisioning.py
          git commit -m "style: format discovery-first setup"
          git push origin HEAD:web/setup-auto-discovery-ci-fix
