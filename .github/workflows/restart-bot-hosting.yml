name: Probe Rob-bot startup

on:
  push:
    branches:
      - ops/bot-hosting-restart
    paths:
      - .ops/bot-hosting-restart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOT_HOSTING_API_KEY: ${{ secrets.BOT_HOSTING_API_KEY }}
      BOT_HOSTING_DEPLOYMENT_ID: ${{ secrets.BOT_HOSTING_DEPLOYMENT_ID }}

    steps:
      - name: Validate probe configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BOT_HOSTING_API_KEY}" ]] || { echo "::error::Missing repository secret BOT_HOSTING_API_KEY"; exit 1; }
          [[ -n "${BOT_HOSTING_DEPLOYMENT_ID}" ]] || { echo "::error::Missing repository secret BOT_HOSTING_DEPLOYMENT_ID"; exit 1; }

      - name: Start and observe deployment
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${BOT_HOSTING_API_KEY}" \
              --header "Content-Type: application/json" \
              --data '{"action":"start","waitSeconds":45}' \
              "https://bot-hosting.net/api/v1/deployments/${BOT_HOSTING_DEPLOYMENT_ID}/power"
          )"
          printf '%s\n' "${response}"
