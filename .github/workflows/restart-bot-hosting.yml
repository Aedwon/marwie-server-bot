name: Diagnose Rob-bot

on:
  push:
    branches:
      - ops/bot-hosting-restart
    paths:
      - .ops/bot-hosting-restart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOT_HOSTING_API_KEY: ${{ secrets.BOT_HOSTING_API_KEY }}
      BOT_HOSTING_DEPLOYMENT_ID: ${{ secrets.BOT_HOSTING_DEPLOYMENT_ID }}

    steps:
      - name: Validate diagnostic configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BOT_HOSTING_API_KEY}" ]] || { echo "::error::Missing repository secret BOT_HOSTING_API_KEY"; exit 1; }
          [[ -n "${BOT_HOSTING_DEPLOYMENT_ID}" ]] || { echo "::error::Missing repository secret BOT_HOSTING_DEPLOYMENT_ID"; exit 1; }

      - name: Read linked Git state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${BOT_HOSTING_API_KEY}" \
            "https://bot-hosting.net/api/v1/deployments/${BOT_HOSTING_DEPLOYMENT_ID}/git"
          echo

      - name: Diagnose Bot-Hosting deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${BOT_HOSTING_API_KEY}" \
            "https://bot-hosting.net/api/v1/deployments/${BOT_HOSTING_DEPLOYMENT_ID}/diagnose?waitSeconds=45"
          echo
