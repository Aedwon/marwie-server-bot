<!doctype html>
<html lang="en" data-theme="light" data-preference="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Rob-bot Control for server configuration and administration.">
  <meta name="theme-color" content="#fcfcfb">
  <title>Control · Rob-bot Handbook</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-robin-v2.png">
  <link rel="apple-touch-icon" href="/favicon-robin-v2.png">
  <script>
    (() => {
      const pref = localStorage.getItem('rob-doc-theme') || 'system';
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.preference = pref;
      document.documentElement.dataset.theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="/control.css?v=25">
  <link rel="stylesheet" href="/control-features.css?v=10">
  <style>#controlMain:focus-visible { outline: none; }</style>
</head>
<body class="control-page">
  <a class="skip" href="#controlMain">Skip to active Control page</a>
  <header class="control-topbar">
    <button id="controlMenuButton" class="control-menu-button" type="button" aria-controls="controlNavDrawer" aria-expanded="false">Menu</button>
    <a class="control-mobile-brand" href="/control">Rob-bot Control</a>
    <button id="controlContextButton" class="control-context-button" type="button" data-control-context-open data-context-trigger="topbar" aria-controls="controlContextDrawer" aria-expanded="false" hidden>Context</button>
  </header>

  <div class="control-shell" data-context="false" data-nav-mode="expanded" data-context-mode="none">
    <aside id="controlNavDrawer" class="control-rail" aria-label="Control navigation">
      <div class="control-rail-head">
        <a class="control-brand" href="/" aria-label="Rob-bot Control Panel"><img src="/rob-robin.jpg?v=1" alt=""><span>Rob-bot Control Panel</span></a>
        <button id="controlNavToggle" class="control-nav-toggle" type="button" aria-label="Collapse navigation" title="Collapse navigation">
          <span class="control-nav-toggle-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" focusable="false"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM40,152H56a8,8,0,0,0,0-16H40V120H56a8,8,0,0,0,0-16H40V88H56a8,8,0,0,0,0-16H40V56H80V200H40Zm176,48H96V56H216V200Z"/></svg></span>
        </button>
        <button id="controlNavClose" class="control-nav-close" type="button" aria-label="Close Control navigation">Close</button>
      </div>
      <div id="controlNavContent"></div>
      <div class="control-rail-foot">
        <div id="controlIdentity" class="control-identity" aria-label="Current Control identity"></div>
        <div class="control-appearance" role="group" aria-label="Appearance">
          <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z"/></svg>
          </button>
          <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light theme" title="Light">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" data-theme-choice="system" aria-pressed="true" aria-label="Follow system theme" title="System">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main id="controlMain" class="control-main" tabindex="-1"></main>

    <aside id="controlContextDrawer" class="control-context-shell" aria-label="Page context" hidden>
      <div class="control-context-head">
        <strong>Context</strong>
        <button id="controlContextClose" class="control-context-close" type="button" aria-label="Close page context">Close</button>
      </div>
      <div id="controlContext"></div>
    </aside>
  </div>

  <div id="controlChangesTray" class="control-changes-tray-mount" role="status" aria-live="polite"></div>

  <script type="module" src="/control-app.js?v=18"></script>
</body>
</html>
