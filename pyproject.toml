[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marwie-server-bot"
version = "0.1.0"
description = "Discord bot for the Marwie server community"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "discord.py>=2.6,<3.0",
  "aiohttp>=3.14,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.16,<2.0",
  "aiosqlite>=0.21,<1.0",
  "asyncpg>=0.30,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.17,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
